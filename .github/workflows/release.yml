name: Release

# design.md §1.3 (D3), deviation from proposal §5.3 applied deliberately: the
# artifact scan is BLOCKING on release tags, and publish `needs:` it — not
# merely runs alongside it. No `continue-on-error` anywhere in this file.
#
# Three gates, one per job:
#   build   — produces the release bundle AND a deliberately e2e-enabled
#             debug binary (the positive control), on the same runner.
#   scan    — G2: downloads what build produced (does not rebuild), re-hashes
#             it, then runs the string+symbol scan against both artifacts.
#   publish — needs: [scan]. GitHub Actions skips a job whose `needs`
#             dependency failed, so a failed scan cannot be followed by a
#             publish.
on:
  push:
    tags:
      - "v*"
  # Convenience trigger for testing this pipeline without cutting a real
  # tag. Does not weaken the tag-triggered path's guarantees — `publish`
  # still needs: [scan] regardless of how the run started, and a
  # dispatch-triggered run still has to pass the same gates.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release bundle + e2e positive-control binary
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The artifact under scrutiny — no e2e-webdriver feature, release
      # profile. `compile_error!` (design.md §1.1) makes the two
      # incompatible; this step's success already proves the feature is off.
      - name: Build the release bundle
        run: pnpm app:build

      # The mandatory positive control (design.md §1.3): built here, in the
      # same job, on the same runner, so the scan job can prove it can still
      # fail before trusting its verdict on the release bundle above.
      - name: Build the e2e-webdriver positive-control binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --features e2e-webdriver

      - name: Record the release build graph (provenance)
        run: cargo tree -p gitvisor -e normal --release > release-build-graph.txt

      # G3 — provenance. Hashed here, before upload; the scan job re-hashes
      # after download and diffs against this, so "the artifact scanned" and
      # "the artifact published" are provably the same bytes.
      - name: sha256 every Mach-O under the release bundle
        run: |
          set -euo pipefail
          find target/release/bundle -type f -print0 |
            xargs -0 -I{} sh -c 'file "{}" | grep -q "Mach-O" && sha256sum "{}"' \
            > release-provenance.sha256 || true
          cat release-provenance.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: target/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-positive-control-binary
          path: target/debug/gitvisor

      - uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: |
            release-build-graph.txt
            release-provenance.sha256

  scan:
    name: "G2 — release-artifact scan (blocking)"
    needs: [build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle

      - uses: actions/download-artifact@v4
        with:
          name: e2e-positive-control-binary
          path: e2e-binary

      - uses: actions/download-artifact@v4
        with:
          name: release-provenance
          path: provenance

      - name: Re-hash the downloaded release bundle and diff against the build job's manifest
        run: |
          set -euo pipefail
          find release-bundle -type f -print0 |
            xargs -0 -I{} sh -c 'file "{}" | grep -q "Mach-O" && sha256sum "{}"' \
            > rehash.sha256 || true
          # Both manifests list the same relative-path suffix
          # ("<bundle-root>/Contents/..."); compare the hash + suffix pairs,
          # not the full paths, since the download and build jobs use
          # different root directory names.
          normalize() { awk '{print $1, $2}' "$1" | sed -E 's#[^ ]*(/Contents/)#\1#'; }
          normalize provenance/release-provenance.sha256 > expected.norm
          normalize rehash.sha256 > actual.norm
          diff <(sort expected.norm) <(sort actual.norm)
          echo "provenance: downloaded bundle hashes match the build job's manifest"

      - name: chmod +x the downloaded e2e binary
        run: chmod +x e2e-binary/gitvisor

      - name: "G2 — string+symbol scan, with the mandatory positive control"
        run: |
          ./scripts/release-scan.sh --positive-control \
            "release-bundle/macos/Gitvisor.app/Contents" \
            "e2e-binary/gitvisor"

  publish:
    name: Publish release
    needs: [scan]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle

      - uses: actions/download-artifact@v4
        with:
          name: release-provenance
          path: provenance

      - name: Publish the DMG and provenance as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundle/dmg/*.dmg
            provenance/release-build-graph.txt
            provenance/release-provenance.sha256
          generate_release_notes: true
